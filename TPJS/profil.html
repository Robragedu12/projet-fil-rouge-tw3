    <script>
        const utilisateur = {
            nom: "Alice",
            age: 28,
            ville: "Paris"
        };

        class Profil {
            constructor(nom, age, ville) {
                this.nom = nom;
                this.age = age;
                this.ville = ville;
            }

            afficher() {
                document.querySelector("#sortie").textContent =
                    `Nom : ${this.nom} | Age : ${this.age} | Ville : ${this.ville}`;
            }
        }

        class Etudiant extends Profil {
            constructor(user, etud){
                super(user.nom, user.age, user.ville);
                this.etud = etud;
            }

            afficher() {
                super.afficher();
                document.querySelector("#sortie").textContent =
                    `Nom : ${this.nom} | Age : ${this.age} | Ville : ${this.ville} | Etudiant : ${this.etud}`;
            }
        }

        const profil = new Profil(utilisateur);
        profil.afficher();

function memoize(fn) {
const cache = new Map()
return function(...args) {
  const key = args[0]

    if (cache.has(key)) {
        return cache.get(key)
    } else {
        const result = fn.apply(this, args)
        cache.set(key , result)
    }


  return result
}
}

function dedupliquer(liste) {
    const uniqueListe = [...new Set(liste)]
return uniqueListe
}

function attendre(ms) {
  return new Promise(resolve => {
    setTimeout(() =>{resolve()} , ms)
  })

async function attendreTout(msList) {
    return await Promise.all(msList.map(ms => attendre(ms)))
// TODO: transformer chaque ms en Promise via attendre(), puis utiliser Promise.all
