<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Taches</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 15px;
        cursor: pointer;
      }
      input {
        padding: 10px;
        margin-bottom: 15px;
        width: 260px;
      }
      pre {
        background: #f4f4f4;
        padding: 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Test des routes Taches</h1>

    <label for="jeton">Jeton d’authentification (Bearer) :</label><br />
    <input id="jeton" type="text"/><br />

    <label for="page">Page :</label><br />
    <input id="page" type="number" min="1" step="1"/><br />

    <label for="limit">limit :</label><br />
    <input id="limit" type="number" min="1" step="1"/><br />

    <label for="task">Nom de la tache :</label><br />
    <input id="task" type="text"/><br />


    <div class="actions">
      <button id="getAll">GET /api/taches</button>
      <button id="getOne">GET /api/taches/:id</button>
      <button id="post">POST /api/taches</button>
      <button id="patch">PATCH /api/taches/:id</button>
      <button id="delete">DELETE /api/taches/:id</button>
    </div>

    <pre id="resultat">Résultat...</pre>

    <script>
      const resultat = document.getElementById("resultat");

      async function appelerApi(method, url, body) {
        const jeton = document.getElementById("jeton").value.trim();
        const options = {
          method,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${jeton}`
          }
        };

        if (body) {
          options.body = JSON.stringify(body);
        }

        try {
          const reponse = await fetch(url, options);
          const data = await reponse.json();

          resultat.textContent = JSON.stringify({
            status: reponse.status,
            data
          }, null, 2);
        } catch (erreur) {
          resultat.textContent = `Erreur lors de l’appel à l’API : ${erreur.message}`;
        }
      }

      document.getElementById("getAll").addEventListener("click", () => {
        const page = document.getElementById("page").value.trim();
        const limit = document.getElementById("limit").value.trim();
        const params = new URLSearchParams();

        if (page) params.set("page", page);
        if (limit) params.set("limit", limit);

        const query = params.toString();
        appelerApi("GET", "/api/taches/v1/" + (query ? `?${query}` : ""));
      });

      document.getElementById("getOne").addEventListener("click", () => {
        appelerApi("GET", "/api/taches/v1/"+ document.getElementById("task").value.trim());
      });

      document.getElementById("post").addEventListener("click", () => {
        appelerApi("POST", "/api/taches/v1", {
          id: document.getElementById("task").value.trim(),
          faite: document.getElementById("bool").value.trim()
        });
      });

      document.getElementById("patch").addEventListener("click", () => {
        appelerApi("PATCH", "/api/taches/v1/"+ document.getElementById("task").value.trim(), {
          faite: document.getElementById("bool").value.trim()
        });
      });

      document.getElementById("delete").addEventListener("click", () => {
        appelerApi("DELETE", "/api/taches/v1/" + document.getElementById("task").value.trim());
      });
    </script>
  </body>
</html>
